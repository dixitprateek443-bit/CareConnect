# ==============================================================================
# CareConnect Healthcare Management - Spring Boot 3 Backend
# ==============================================================================
server.port=8080
spring.application.name=careconnect-backend

# Database Configuration (Oracle Mode with Persistent Disk Storage)
# Database file is stored permanently in ./data/careconnectdb
# Switch to native Oracle 19c/21c/23c by running with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=oracle
# Or provide ORACLE_URL / ORACLE_USER / ORACLE_PASSWORD environment variables.
spring.datasource.url=${ORACLE_URL:jdbc:h2:file:./data/careconnectdb;MODE=Oracle;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${ORACLE_DRIVER:org.h2.Driver}
spring.datasource.username=${ORACLE_USER:careconnect}
spring.datasource.password=${ORACLE_PASSWORD:careconnect123}

# JPA & Hibernate Settings (Oracle Compatibility)
spring.jpa.database-platform=${ORACLE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool Stability & Drop-Prevention Settings
# Prevents idle connection dropouts, broken pipes, and timeouts after hours of inactivity
spring.datasource.hikari.pool-name=CareConnectHikariPool
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# Embedded Tomcat Connection & Keep-Alive Settings
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=60000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# H2 Web Console for interactive database inspection during Viva
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload configuration for medical reports (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.careconnect=INFO
logging.level.org.springframework.web=INFO
