# ==============================================================================
# CareConnect Healthcare Management - Spring Boot 3 Backend
# ==============================================================================
server.port=8080
spring.application.name=careconnect-backend

# Database Configuration (Oracle Mode)
# Switch to native Oracle 19c/21c/23c by running with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=oracle
# Or provide ORACLE_URL / ORACLE_USER / ORACLE_PASSWORD environment variables.
spring.datasource.url=${ORACLE_URL:jdbc:h2:mem:careconnectdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${ORACLE_DRIVER:org.h2.Driver}
spring.datasource.username=${ORACLE_USER:careconnect}
spring.datasource.password=${ORACLE_PASSWORD:careconnect123}

# JPA & Hibernate Settings (Oracle Compatibility)
spring.jpa.database-platform=${ORACLE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console for interactive database inspection during Viva
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# File upload configuration for medical reports (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.careconnect=INFO
logging.level.org.springframework.web=INFO
