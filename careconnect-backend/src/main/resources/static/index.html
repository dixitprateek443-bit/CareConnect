<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnect — Patient Records & Healthcare Management</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons for clean medical UI -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- NAVIGATION HEADER -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#" class="brand" onclick="navigateTo('home')">
        <div class="brand-icon">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <div class="brand-text">
          <span class="brand-title">Care<span>Connect</span></span>
          <span class="brand-sub">Healthcare & EHR Suite</span>
        </div>
      </a>

      <nav class="nav-links" id="navLinks">
        <!-- Dynamic based on authentication -->
      </nav>

      <div class="nav-auth" id="navAuth">
        <!-- Auth buttons or User Profile pill rendered dynamically -->
      </div>
    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="main-content" id="appRoot">
    <!-- Dynamic Views will be rendered here by router -->
  </main>

  <!-- NOTIFICATION TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- MODAL CONTAINER (For Appointments, Prescriptions, Doctor Details) -->
  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModalOnBackdrop(event)">
    <div class="modal-card" id="modalCard">
      <!-- Modal Header & Body injected dynamically -->
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="app-footer">
    <div class="footer-container">
      <div class="footer-left">
        <div class="brand-title">Care<span>Connect</span></div>
        <p>Enterprise Patient Record & Hospital Management System. Secure Digital Healthcare & EHR Platform.</p>
      </div>
      <div class="footer-right">
        <div class="status-indicator">
          <span class="status-dot"></span> System Operational
        </div>
        <div class="viva-note">Prepared for College Examination & Project Defense</div>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
