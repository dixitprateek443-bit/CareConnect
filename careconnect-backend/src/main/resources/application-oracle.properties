# ==============================================================================
# CareConnect - Native Oracle Database 19c / 21c / 23c Profile
# ==============================================================================
# Activate this profile using:
#   mvn spring-boot:run -Dspring-boot.run.profiles=oracle
# Or in PowerShell:
#   $env:SPRING_PROFILES_ACTIVE="oracle"; mvn spring-boot:run
#
# Customise your Oracle credentials with environment variables:
#   ORACLE_URL, ORACLE_HOST, ORACLE_PORT, ORACLE_SERVICE, ORACLE_USER, ORACLE_PASSWORD
# ==============================================================================

server.port=8080
spring.application.name=careconnect-backend

# Oracle JDBC Connection Details
# Default connects to local Oracle XE pluggable database: XEPDB1 (or ORCL / FREEPDB1)
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@${ORACLE_HOST:localhost}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:XEPDB1}}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${ORACLE_USER:c##careconnect}
spring.datasource.password=${ORACLE_PASSWORD:CareConnect2026#}

# Enterprise HikariCP Connection Pooling for Oracle
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=CareConnectOraclePool

# Hibernate Oracle Dialect Settings
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File upload configuration for medical reports (max 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.careconnect=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
